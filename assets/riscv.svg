<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-labelledby="t"><title id="t">Now building: RISC-V CPU, CG3207 Computer Architecture. A RISC-V processor in Verilog on a Nexys 4 FPGA, with a multi-cycle radix-4 Booth multiply/divide unit. Verilog, Vivado, RARS.</title><style>
