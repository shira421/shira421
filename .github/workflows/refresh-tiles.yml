name: Refresh profile tiles

on:
  schedule:
    - cron: "17 18 * * *"   # daily, 02:17 Singapore time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build tiles and README
        run: python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a personal access token (read:user) also counts private contributions.
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh profile tiles"
            git push
          fi
